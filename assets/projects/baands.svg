<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <title>Illustration of the Baands app home screen: total balance, currency pills, spending cards, a budget bar and an AI chat card</title>
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#e3f8ea"/>
      <stop offset="1" stop-color="#f6fbf7"/>
    </linearGradient>
    <linearGradient id="spent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#d9f99d"/>
    </linearGradient>
    <clipPath id="screen-clip"><rect x="352" y="44" width="256" height="512" rx="30"/></clipPath>
  </defs>

  <rect width="960" height="600" fill="#ede3d4"/>
  <circle cx="170" cy="130" r="120" fill="#f4ece0"/>
  <circle cx="820" cy="480" r="140" fill="#f4ece0"/>

  <!-- phone -->
  <rect x="338" y="30" width="284" height="540" rx="42" fill="#111"/>
  <g clip-path="url(#screen-clip)">
    <rect x="352" y="44" width="256" height="512" fill="url(#screen)"/>

    <!-- app bar -->
    <text x="372" y="102" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="24" fill="#111">Baands</text>
    <circle cx="552" cy="94" r="15" fill="#c9b8a6"/>
    <circle cx="586" cy="94" r="15" fill="#111"/>
    <path d="M586 87v14M579 94h14" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- currency pills -->
    <rect x="404" y="122" width="36" height="18" rx="9" fill="#111"/>
    <rect x="444" y="122" width="36" height="18" rx="9" fill="#e7e7e7"/>
    <rect x="484" y="122" width="36" height="18" rx="9" fill="#e7e7e7"/>
    <rect x="524" y="122" width="36" height="18" rx="9" fill="#e7e7e7"/>

    <!-- total balance -->
    <rect x="392" y="156" width="176" height="28" rx="8" fill="#111"/>
    <rect x="436" y="194" width="88" height="8" rx="4" fill="#4ade80"/>

    <!-- spent / received + account cards -->
    <rect x="362" y="218" width="112" height="96" rx="16" fill="#fff"/>
    <rect x="374" y="234" width="40" height="7" rx="3.5" fill="#9ca3af"/>
    <rect x="374" y="248" width="62" height="16" rx="5" fill="#4b5563"/>
    <rect x="374" y="274" width="44" height="7" rx="3.5" fill="#9ca3af"/>
    <rect x="374" y="288" width="66" height="16" rx="5" fill="#4b5563"/>
    <rect x="482" y="218" width="112" height="96" rx="16" fill="#f0fdf4"/>
    <rect x="494" y="230" width="30" height="30" rx="8" fill="#fff"/>
    <text x="501" y="253" font-family="Arial Black, Arial, sans-serif" font-size="20" fill="#111">R</text>
    <rect x="494" y="272" width="64" height="16" rx="5" fill="#4b5563"/>
    <rect x="494" y="294" width="56" height="7" rx="3.5" fill="#4ade80"/>

    <!-- budget -->
    <rect x="362" y="324" width="236" height="76" rx="16" fill="#fff"/>
    <rect x="376" y="338" width="44" height="7" rx="3.5" fill="#9ca3af"/>
    <rect x="376" y="352" width="70" height="16" rx="5" fill="#111"/>
    <rect x="532" y="334" width="44" height="34" rx="6" fill="#86efac" transform="rotate(-12 554 351)"/>
    <rect x="547" y="334" width="10" height="34" fill="#fbbf24" transform="rotate(-12 554 351)"/>
    <rect x="372" y="378" width="216" height="14" rx="7" fill="#f1f1f1"/>
    <rect x="372" y="378" width="88" height="14" rx="7" fill="url(#spent)"/>

    <!-- calendar -->
    <rect x="362" y="410" width="236" height="70" rx="16" fill="#fff"/>
    <rect x="376" y="424" width="50" height="7" rx="3.5" fill="#9ca3af"/>
    <rect x="376" y="437" width="84" height="14" rx="5" fill="#111"/>
    <rect x="372" y="458" width="112" height="16" rx="8" fill="#eef2ff"/>
    <circle cx="382" cy="466" r="3.5" fill="#2563eb"/>
    <rect x="490" y="458" width="100" height="16" rx="8" fill="#f1f1f1"/>

    <!-- bottom prompt bar -->
    <rect x="362" y="500" width="150" height="34" rx="17" fill="#fff"/>
    <path d="M378 517h12M384 511v12" stroke="#111" stroke-width="2" stroke-linecap="round"/>
    <rect x="398" y="513" width="70" height="8" rx="4" fill="#c4c4c4"/>
    <rect x="490" y="508" width="10" height="16" rx="5" fill="none" stroke="#111" stroke-width="2"/>
    <rect x="524" y="512" width="34" height="9" rx="4.5" fill="#111"/>
    <rect x="564" y="512" width="34" height="9" rx="4.5" fill="#d4d4d4"/>
  </g>

  <!-- AI chat card -->
  <g transform="translate(646 150)">
    <rect width="230" height="150" rx="20" fill="#fff"/>
    <rect width="230" height="150" rx="20" fill="#dcfce7" opacity=".35"/>
    <rect x="18" y="18" width="24" height="20" rx="6" fill="none" stroke="#111" stroke-width="2"/>
    <rect x="18" y="52" width="180" height="10" rx="5" fill="#374151"/>
    <rect x="18" y="70" width="150" height="10" rx="5" fill="#374151"/>
    <rect x="18" y="88" width="120" height="10" rx="5" fill="#374151"/>
    <rect x="18" y="114" width="76" height="22" rx="11" fill="#111"/>
    <rect x="30" y="122" width="52" height="6" rx="3" fill="#fff"/>
  </g>

  <!-- calendar sticker -->
  <g transform="translate(120 330) rotate(-10)">
    <rect width="120" height="120" rx="24" fill="#111"/>
    <rect x="10" y="10" width="100" height="100" rx="16" fill="#f5f5f5"/>
    <rect x="10" y="10" width="100" height="28" rx="12" fill="#ef4444"/>
    <rect x="28" y="56" width="64" height="8" rx="4" fill="#d4d4d4"/>
    <rect x="28" y="74" width="44" height="8" rx="4" fill="#d4d4d4"/>
  </g>
</svg>
